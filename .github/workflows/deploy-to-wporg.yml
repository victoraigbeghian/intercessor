name: Deploy to WordPress.org

# Triggers on any tag of the form v1.0.0 (or 1.0.0 without the v prefix).
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  deploy:
    name: Build & deploy to WordPress.org SVN
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout the tagged commit ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js & build the Gutenberg blocks ─────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build block scripts
        run: npm run build

      # ── 3. Deploy to WordPress.org SVN ─────────────────────────────────────
      # Requires two repository secrets (Settings → Secrets → Actions):
      #   SVN_USERNAME  — your WordPress.org username  (e.g. shepherd365)
      #   SVN_PASSWORD  — your WordPress.org password
      #
      # The action will:
      #   • Sync the built plugin to SVN trunk/
      #   • Create a versioned tag in SVN tags/{version}/
      #   • Update the Stable tag in readme.txt automatically
      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG:         intercessor
          VERSION:      ${{ github.ref_name }}
          ASSETS_DIR:   .wordpress-org
